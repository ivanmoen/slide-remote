<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slide Remote</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0c;
      color: #e9e9ef;
      padding: 14px 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: #cfcfd9;
    }
    .row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .row + .row { margin-top: 6px; }
    .dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: #6e6e75;
      box-shadow: 0 0 8px transparent;
    }
    .dot.ok    { background: #a78bfa; box-shadow: 0 0 8px #a78bfa66; }
    .dot.warn  { background: #facc15; }
    .dot.error { background: #ef4444; }
    .label { color: #b3b3bf; }
    .value { color: #f1f1f7; font-variant-numeric: tabular-nums; }
    .hint  { margin-top: 12px; padding-top: 10px; border-top: 1px solid #2a2a30; font-size: 11px; color: #8d8d97; line-height: 1.4; }
    code { background: #1a1a1f; padding: 1px 5px; border-radius: 4px; color: #c4b5fd; font-size: 11px; }
  </style>
</head>
<body>
  <h1>SLIDE REMOTE — GOOGLE SLIDES</h1>
  <div class="row"><span id="conn-dot" class="dot"></span><span class="label">Helper</span><span class="value" id="conn-text">checking…</span></div>
  <div class="row"><span id="page-dot" class="dot"></span><span class="label">Slides tab</span><span class="value" id="page-text">—</span></div>
  <div class="row"><span class="label">Slide</span><span class="value" id="slide-text">—</span></div>
  <div class="hint">
    The helper must be running and listening on <code>ws://127.0.0.1:7799</code>.
    Open a Google Slides deck and start the slideshow.
  </div>
  <script src="popup.js"></script>
</body>
</html>
