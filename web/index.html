<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Slide Remote" />
  <title>Slide Remote</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="is-disconnected">
  <div class="progress-track" aria-hidden="true">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <header class="app-bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10 10l4 2-4 2z" fill="currentColor"/>
        <path d="M9 20h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Slide Remote</span>
      <span class="brand-version" title="Build version">v1.2</span>
    </div>
    <button id="connectBtn" class="conn-chip" type="button" aria-live="polite">
      <span id="dot" class="dot disconnected" aria-hidden="true"></span>
      <span id="statusText">Connect</span>
    </button>
  </header>

  <main>
    <section id="banner" class="banner hidden" role="status"></section>

    <section class="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="counter-block">
        <div class="counter-line">
          <span id="slideCounter" class="counter-num">—</span>
          <span id="counterTotal" class="counter-total">/ —</span>
        </div>
        <div class="counter-meta">
          <span id="modeTag" class="mode-tag">Not connected</span>
          <span class="meta-sep" aria-hidden="true"></span>
          <span class="timer-block">
            <svg class="timer-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 9v4l2.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10 4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span id="timer" class="timer">00:00</span>
          </span>
        </div>
      </div>
      <div id="slideThumb" class="slide-thumb" aria-hidden="true">
        <img id="slideThumbImg" alt="" />
      </div>
    </section>

    <section class="nav-row">
      <button id="prevBtn" class="nav-btn" disabled aria-label="Previous slide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="nav-label">Prev</span>
      </button>
      <button id="nextBtn" class="nav-btn nav-primary" disabled aria-label="Next slide">
        <span class="nav-label">Next</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <section class="quick-row" role="group" aria-label="Quick actions">
      <button id="blackBtn" class="chip" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" fill="currentColor"/></svg>
        <span>Black</span>
      </button>
      <button id="whiteBtn" class="chip" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="6.5" width="15" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>White</span>
      </button>
      <button id="startBtn" class="chip" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        <span>Start</span>
      </button>
      <button id="endBtn" class="chip" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor"/></svg>
        <span>End</span>
      </button>
    </section>

    <section class="notes-card">
      <header class="notes-head">
        <span class="notes-label">
          <svg class="notes-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Speaker notes
        </span>
        <span id="notesSlideTag" class="notes-tag hidden"></span>
      </header>
      <div id="notes" class="notes" aria-live="polite">
        <p class="placeholder">Tap <strong>Connect</strong> to pair with your PC. Speaker notes for the current slide will appear here.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
